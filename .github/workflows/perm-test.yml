name: perm-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: CLI create (full stderr), API create plus CLI upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh --version | head -1
          echo "--- C: gh release create with checkout ---"
          gh release create perm-c-$GITHUB_RUN_ID --target "$GITHUB_SHA" --title perm-c --notes "probe"; echo "exit=$?"
          echo "--- E: gh api create published, then gh release upload ---"
          gh api -X POST repos/$GITHUB_REPOSITORY/releases -f tag_name=perm-e-$GITHUB_RUN_ID -f target_commitish=$GITHUB_SHA -f name=perm-e -f body=probe -F draft=false --jq '.id'
          echo "probe asset" > asset.txt
          gh release upload perm-e-$GITHUB_RUN_ID asset.txt --clobber; echo "upload exit=$?"
          gh release view perm-e-$GITHUB_RUN_ID --json assets --jq '.assets[].name'
          echo "--- cleanup ---"
          for t in perm-c perm-e; do gh release delete $t-$GITHUB_RUN_ID --yes --cleanup-tag; echo "delete $t exit=$?"; done
